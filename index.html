<!DOCTYPE html>
<html>
<head>
  <title>Trollpicks</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f2f4f8;
    }

    .logo {
      height: 250px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .header {
      background: #0b1f3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      height: 270px;
    }
  
    .header img {
      display: block;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      margin-bottom: 5px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      position: relative;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 8px solid transparent;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.08);
    }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }

    .content {
      padding: 12px;
      text-align: center;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .modal-header {
      background: #0b1f3a;
      color: white;
      padding: 15px;
    
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-left,
    .modal-right {
      font-size: 20px;
      font-weight: bold;
      width: 80px; /* pour équilibrer */
    }

    .modal-title {
      font-size: 42px;
      font-weight: 600;
      text-align: center;
      flex: 1;
    }

    #modalNote {
      font-size: 22px;      /* 👈 plus gros */
      font-weight: 60;     /* 👈 très gras */
      width: 90px;
    }

    .btn-img-ui {
      height: 90px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .modal-header div {
      color: white;
    }
    
    .btn-img-ui:hover {
      transform: scale(1.2);
    }

    .note {
      margin-top: 5px;
      color: #555;
    }

    /* NUMERO */
    .index {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.9);
      color: white;
      padding: 10px;
      font-size: 18px;
      border-radius: 8px;
    }

    /* BADGE MUSIQUE */
    .music-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      background: #ff2f92; /* rose/magenta */
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .music-badge img {
      width: 22px;
      height: 22px;
    }

    .active {
      filter: brightness(1.3);
    }

    .build {
  margin-top: 10px;
    }
    
    .build-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    
    .build-label {
      font-weight: bold;
      min-width: 120px;
    }
    
    .build-items img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
    }

    .build-items img:hover {
      transform: scale(1.2);
    }

    /* MODAL */
    .modal {
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.8);
      display:none;
      justify-content:center;
      align-items:center;
    }

    .modal-content {
      background:white;
      width:75%;
      max-height:90%;
      border-radius:12px;
      display:flex;
      overflow:hidden;
    }


  #modalTitle {
  font-size: 42px;
  font-weight: 600;
  text-align: center;
  flex: 1;
}

#modalIndex {
  font-size: 26px;
  font-weight: 600;
  width: 90px;
}

#modalNote {
  font-size: 22px;
  font-weight: 600;
  width: 90px;
}

    .label {
      color: white;
  font-weight: bold;
  font-size: 18px;
}

    .left {
      width:40%;
    }

    .left-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sort-buttons {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.right-controls {
  display: flex;
  align-items: center;
}

    .random-btn {
  height: 110px;
}


    .left img {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .right {
  width: 60%;
  display: flex;
  flex-direction: column;
  gap: 15px; /* espace entre les blocs */
  padding: 20px;
}

    .info {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 20px;
}
    .desc {
      font-size:18px;
      color:#333;
      text-align:left;
      width:100%;
    }

    /* PLAYER */
    .player {
      background:#111;
      color:white;
      padding:8px 10px;
      border-radius:10px;
      margin-bottom: 10px;  /* centre le bloc */
      width: 95%;        /* 👈 augmente la largeur */
      margin: 10px auto; /* 👈 centre horizontalement */
    }

    .player-title {
      font-size:22px;
      margin-bottom:10px;
    }

    .player-controls {
      display:flex;
      align-items:center;
      gap:10px;
    }

    .progress {
      flex:1;
    }

    .volume-container {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.volume-icon {
  width: 25px;
  margin-bottom: 5px;
}

.volume {
  height: 60px;
  writing-mode: bt-lr;
  -webkit-appearance: slider-vertical;
}

    .btn-img {
      width:40px;
      cursor:pointer;
    }

    .time {
      font-size:14px;
      width:50px;
      text-align:center;
    }

  </style>
</head>

const grid = document.getElementById("grid");
const audio = document.getElementById("audio");

audio.volume = 0.1;

function render(){

  grid.innerHTML="";

  let data = [...trollpicks];
  if(mode==="note") data.sort((a,b)=>b.note-a.note);

  const sorted = [...trollpicks].sort((a,b)=>b.note-a.note);
  const top1 = sorted[0].note;
  const top2 = sorted.find(x=>x.note<top1)?.note;
  const top3 = sorted.find(x=>x.note<top2)?.note;

  data.forEach(t=>{
    let border="transparent";
    if(t.note===top1) border="gold";
    else if(t.note===top2) border="#9a9a9a";
    else if(t.note===top3) border="#cd7f32";

    const indexOriginal = trollpicks.indexOf(t)+1;

    const card=document.createElement("div");
    card.className="card";
    card.style.borderColor=border;

    card.innerHTML=`
      <div class="index">#${indexOriginal}</div>

      ${t.music ? `
        <div class="music-badge">
          <img src="note.png">
        </div>
      ` : ""}

      <img src="${t.name}.png" onerror="this.src='cooking.png'">

      <div class="content">
        <div class="title">${t.name}</div>
        <div class="note">⭐ ${t.note}/10</div>
      </div>
    `;

    card.onclick=()=>openModal(t);

    grid.appendChild(card);
  });
}

function sortBy(type){
  mode = type;
  render();
}

function randomPick(){

  let minNote = prompt("Note minimale ? (0 à 10)");

  if(minNote === null) return; // si annule

  minNote = parseFloat(minNote);

  if(isNaN(minNote)) {
    alert("Entre un nombre valide");
    return;
  }

  // filtre
  const valid = trollpicks.filter(t => t.note >= minNote);

  if(valid.length === 0){
    alert("Aucun trollpick avec cette note");
    return;
  }

  // choix aléatoire
  const random = valid[Math.floor(Math.random() * valid.length)];

  // ouverture
  openModal(random);
}  

function openModal(t){
  document.getElementById("modal").style.display="flex";

  // IMAGE
  const img = document.getElementById("modalImg");
  img.src = t.name + ".png";
  img.onerror = function(){
    this.src = "cooking.png";
  };

  // TEXTE
  document.getElementById("modalTitle").textContent = t.name;
  document.getElementById("modalDesc").textContent = t.desc;
  document.getElementById("playerTitle").textContent = t.name;

  // NOTE
  document.getElementById("modalNote").textContent = "⭐ " + t.note + "/10";

  // INDEX
  const index = trollpicks.findIndex(tp => tp.name === t.name) + 1;
  document.getElementById("modalIndex").textContent = "#" + index;

  // AUDIO
  audio.src = t.name + ".mp3";

  const container = document.getElementById("buildContainer");
container.innerHTML = "";

// CAS 1 : build simple
if(t.build){
  const row = document.createElement("div");
  row.className = "build-row";

  row.innerHTML = `
    <div class="build-label">Build :</div>
    <div class="build-items">
      ${t.build.map(item => `<img src="${item}.png">`).join("")}
    </div>
  `;

  container.appendChild(row);
}

// CAS 2 : builds multiples
if(t.builds){

  if(t.builds.adc){
    const row = document.createElement("div");
    row.className = "build-row";

    row.innerHTML = `
      <div class="build-label">Build ADC :</div>
      <div class="build-items">
        ${t.builds.adc.map(item => `<img src="${item}.png">`).join("")}
      </div>
    `;

    container.appendChild(row);
  }

  if(t.builds.support){
    const row = document.createElement("div");
    row.className = "build-row";

    row.innerHTML = `
      <div class="build-label">Build Support :</div>
      <div class="build-items">
        ${t.builds.support.map(item => `<img src="${item}.png">`).join("")}
      </div>
    `;

    container.appendChild(row);
  }
}
}

function togglePlay(){
  if(audio.paused) audio.play();
  else audio.pause();
}

const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

audio.addEventListener("timeupdate", ()=>{
  progress.value = (audio.currentTime/audio.duration)*100 || 0;
  currentTime.textContent = format(audio.currentTime);
  duration.textContent = format(audio.duration);
});

progress.addEventListener("input", ()=>{
  audio.currentTime = (progress.value/100)*audio.duration;
});

document.getElementById("volume").addEventListener("input", (e)=>{
  audio.volume = e.target.value;
});

function format(t){
  if(isNaN(t)) return "0:00";
  let m=Math.floor(t/60);
  let s=Math.floor(t%60);
  if(s<10) s="0"+s;
  return m+":"+s;
}

document.getElementById("modal").onclick = (e)=>{
  if(e.target.id==="modal"){
    document.getElementById("modal").style.display="none";
    audio.pause();
  }
};

render();

</script>
